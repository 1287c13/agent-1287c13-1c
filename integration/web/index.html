<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Очередь задач агента 1С</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Очередь задач агента 1С</h1>
  </header>

  <section class="card" id="auth-card">
    <h2>Вход</h2>
    <div class="row">
      <label>Ключ доступа
        <input id="api-key" type="password" placeholder="ключ клиента" autocomplete="off">
      </label>
      <button id="btn-connect" type="button">Войти</button>
      <span id="conn-state" class="state"></span>
    </div>
    <div id="keys-box" class="keys"></div>
  </section>

  <section class="card" id="submit-card" hidden>
    <h2>Новая задача</h2>
    <form id="task-form">
      <div class="row">
        <label>Режим
          <select id="task-mode">
            <option value="db">по базе 1С</option>
            <option value="harness">по инструменту агента</option>
          </select>
        </label>
        <label id="db-field">База
          <input id="task-db" type="text" placeholder="id базы" autocomplete="off">
        </label>
        <label>Роль
          <input id="task-role" type="text" value="программист 1С">
        </label>
        <label>Доставка
          <select id="task-deliver">
            <option value="auto">по умолчанию</option>
            <option value="uri">открыть в Cline</option>
            <option value="manual">вручную</option>
            <option value="echo">проверка без Cline</option>
          </select>
        </label>
      </div>
      <label class="wide">Что сделать
        <textarea id="task-action" rows="3" required placeholder="что сделать"></textarea>
      </label>
      <label class="wide">Цель (необязательно)
        <textarea id="task-goal" rows="2" placeholder="критерий готовности"></textarea>
      </label>
      <div class="row">
        <label>Ждать результат, с
          <input id="task-timeout" type="number" min="60" max="7200" step="60" value="1800">
        </label>
        <button id="btn-submit" type="submit">Отправить задачу</button>
        <span id="submit-state" class="state"></span>
      </div>
    </form>
  </section>

  <section class="card" id="status-card" hidden>
    <h2>Задача <span id="status-id" class="mono"></span></h2>
    <p><span id="status-badge" class="badge">queued</span>
      <span id="status-hint" class="hint"></span></p>
    <dl class="facts">
      <dt>Агент</dt><dd id="status-agent">-</dd>
      <dt>В работе</dt><dd id="status-elapsed">-</dd>
      <dt>Пояснение</dt><dd id="status-message">-</dd>
    </dl>
    <ol id="status-progress" class="progress"></ol>
    <div class="row">
      <button id="btn-answer-md" type="button" disabled>Скачать ответ (.md)</button>
      <button id="btn-answer-html" type="button" disabled>Открыть ответ (HTML)</button>
    </div>
  </section>

  <section class="card" id="history-card" hidden>
    <h2>Последние задачи</h2>
    <div class="row">
      <button id="btn-history" type="button">Обновить историю</button>
      <span id="history-state" class="state"></span>
    </div>
    <table id="history-table">
      <thead>
        <tr><th>Задача</th><th>Стадия</th><th>Агент</th><th>Создана</th><th>Задача</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="app.js"></script>
</body>
</html>
